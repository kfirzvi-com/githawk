name: Release

# Two channels, one number line:
#
#   X.Y.0            stable       tag vX.Y.0
#   X.Y.<commits>    pre-release  push to main
#
# Patch 0 is reserved for stable, every other patch is a pre-release build, so
# no version is ever published on both channels — which the Marketplace forbids,
# and which it enforces by refusing to reissue a version at all.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Serialised across the whole repository, not per ref: two publishes racing for
# the next version number would leave one of them permanently unusable.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Decide what to publish
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Full history: the pre-release build number is the commit count, and the
      # release-commit check needs tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            manifest="$(node -p "require('./package.json').version")"

            if [[ "$version" != "$manifest" ]]; then
              echo "::error::tag v$version disagrees with package.json $manifest"
              exit 1
            fi
            if [[ "${version##*.}" != "0" ]]; then
              echo "::error::a stable release must end in .0 (got $version); other patch numbers belong to pre-release builds"
              exit 1
            fi

            channel=stable

          elif [[ -n "$(git tag --points-at HEAD -l 'v*')" ]]; then
            # The release commit arriving on main. Its tag publishes the stable
            # version; also publishing a pre-release from this commit would take
            # a higher number and lock the stable one out for good. Push the
            # commit and its tag together with --atomic so this check cannot see
            # the commit before the tag exists.
            channel=none
            version=

          else
            # package.json holds the most recent stable version; its major.minor
            # is the line the current pre-releases belong to.
            line="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
            channel=pre-release
            version="$line.$(git rev-list --count HEAD)"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $channel${version:+ $version}"

  ci:
    name: CI
    needs: plan
    if: needs.plan.outputs.channel != 'none'
    uses: ./.github/workflows/ci.yml

  # One package, built once, published to each registry by a job of its own.
  #
  # They used to be two steps in one job, which meant an outage at either
  # registry withheld the build from both audiences — and the Marketplace was
  # first, so its three-minute `/_apis/gallery` timeouts blocked Open VSX from
  # ever being tried. Separate jobs also make the retry surgical: re-running
  # the failed job hits only the registry that failed, where re-running a
  # combined one would try to reissue a version the other registry already has,
  # and be refused.
  #
  # Still one file rather than one build each, which is the point of packaging
  # here and handing both jobs the same artifact: what the two audiences install
  # is byte-for-byte identical.
  package:
    name: Package ${{ needs.plan.outputs.channel }} ${{ needs.plan.outputs.version }}
    needs: [plan, ci]
    if: needs.plan.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Pre-release build numbers are never committed back to main. The commit
      # is the identity of a build; the number only has to sort correctly.
      - name: Stamp the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package
        run: |
          set -euo pipefail
          flag=()
          if [[ "$CHANNEL" == pre-release ]]; then flag=(--pre-release); fi
          npx vsce package "${flag[@]}" --out "githawk-$VERSION.vsix"

      # Both publishing jobs take the vsix from here, so neither rebuilds it.
      - uses: actions/upload-artifact@v4
        with:
          name: githawk-${{ needs.plan.outputs.version }}
          path: githawk-*.vsix
          retention-days: 90

  marketplace:
    name: Visual Studio Marketplace ${{ needs.plan.outputs.version }}
    needs: [plan, package]
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: githawk-${{ needs.plan.outputs.version }}

      - name: Publish
        run: |
          set -euo pipefail
          flag=()
          if [[ "$CHANNEL" == pre-release ]]; then flag=(--pre-release); fi
          npx vsce publish "${flag[@]}" --packagePath "githawk-$VERSION.vsix"

  # Where the forks install from — Cursor, Antigravity, VSCodium, Windsurf.
  # Neither audience should be a version behind the other, which is why this
  # no longer waits on the Marketplace to succeed first.
  #
  # No --pre-release here. ovsx ignores it for an already-packaged vsix and says
  # so; the channel is read from the flag vsce stamped into the manifest.
  openvsx:
    name: Open VSX ${{ needs.plan.outputs.version }}
    needs: [plan, package]
    runs-on: ubuntu-24.04
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: githawk-${{ needs.plan.outputs.version }}

      - name: Publish
        run: npx ovsx publish --packagePath "githawk-$VERSION.vsix" --pat "$OVSX_PAT"

  # Gated on both, deliberately, unlike the two registries are on each other: a
  # GitHub Release is an announcement that a version is out, and announcing one
  # nobody can install from their editor would be a lie. Stable only.
  release:
    name: GitHub Release ${{ needs.plan.outputs.version }}
    needs: [plan, marketplace, openvsx]
    if: needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: githawk-${{ needs.plan.outputs.version }}

      - name: Create it
        run: |
          set -euo pipefail
          node scripts/changelogSection.mjs "$VERSION" > /tmp/notes.md
          gh release create "v$VERSION" "githawk-$VERSION.vsix" \
            --title "GitHawk $VERSION" \
            --notes-file /tmp/notes.md
