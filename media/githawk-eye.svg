<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <!--
        Activity-bar icon. VS Code recolours it, so everything uses currentColor
        and there are no hard-coded fills that would fight the theme.

        A hawk's-eye view: the lane runs in and out of frame with commits above
        and below, and the commit under the eye is the pupil. Symmetric on both
        axes, so it has no preferred direction. The goggle ring and HUD ticks
        that carry the idea further only appear in the marketplace icon — at
        24px there is no room for them.
    -->
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="3.4" r="1.5" />
        <path d="M12 4.9 V7.1" />
        <path d="M12 16.9 V19.1" />
        <circle cx="12" cy="20.6" r="1.5" />
        <path d="M4 12 C7 6.6 17 6.6 20 12 C17 17.4 7 17.4 4 12 Z" />
    </g>
    <circle cx="12" cy="12" r="2.2" fill="currentColor" />
</svg>
